apiVersion: apps/v1
kind: Deployment
metadata:
  name: shiftsync-frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shiftsync-frontend
  template:
    metadata:
      labels:
        app: shiftsync-frontend
    spec:
      containers:
        - name: frontend
          image: shiftsync-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shiftsync-frontend-service
spec:
  type: NodePort
  selector:
    app: shiftsync-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080