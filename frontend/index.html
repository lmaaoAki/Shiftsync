<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ShiftSync — Isolated Multi-Organization Duty Roster System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root{--bg:#f3f5f2;--card:#fff;--ink:#17261f;--mut:#5d6b64;--line:#d8dfda;--pri:#0f6b4f;--pri2:#e4f2ec;--bad:#b3261e;--bad2:#fbe9e7;--warn:#9a6700;--warn2:#fff4d6;--pref:#1d4ed8;--pref2:#dbeafe;--unpref:#b45309;--unpref2:#fef3c7;--busy:#2c3a33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
    @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111a16;--card:#18241e;--ink:#e6efe9;--mut:#9fb0a6;--line:#2b3a32;--pri:#4fc79b;--pri2:#173a2d;--bad:#ff8a80;--bad2:#3a1d1a;--warn:#f0c04a;--warn2:#3a2f12;--pref:#60a5fa;--pref2:#1e3a8a;--unpref:#fbbf24;--unpref2:#451a03;--busy:#8fa398}}
    :root[data-theme=dark]{--bg:#111a16;--card:#18241e;--ink:#e6efe9;--mut:#9fb0a6;--line:#2b3a32;--pri:#4fc79b;--pri2:#173a2d;--bad:#ff8a80;--bad2:#3a1d1a;--warn:#f0c04a;--warn2:#3a2f12;--pref:#60a5fa;--pref2:#1e3a8a;--unpref:#fbbf24;--unpref2:#451a03;--busy:#8fa398}
    *{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
    h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 .4em}h1{font-size:1.65rem}h2{font-size:1.18rem;margin-top:1.2em}
    .app{display:flex;min-height:100vh}nav{width:235px;background:var(--card);border-right:1px solid var(--line);padding:16px 10px;flex-shrink:0}
    nav .logo{font:700 1.35rem Georgia,serif;color:var(--pri);padding:0 8px 4px}
    nav .org-badge{font-size:12px;color:var(--pri);background:var(--pri2);padding:4px 8px;border-radius:6px;margin:0 6px 10px;font-weight:600}
    nav .sec-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:10px 10px 4px;font-weight:700}
    nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:8px 10px;border-radius:6px;font:inherit;font-size:14px;cursor:pointer}
    nav button.on{background:var(--pri2);color:var(--pri);font-weight:600}nav .who{padding:10px 8px;color:var(--mut);font-size:13px;border-top:1px solid var(--line);margin-top:12px}
    main{flex:1;padding:22px;min-width:0;max-width:1100px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin:10px 0}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.stats .card{margin:0}.stats b{display:block;font-size:1.45rem;font-family:Georgia,serif}
    .btn{background:var(--pri);color:#fff;border:0;border-radius:6px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}[data-theme=dark] .btn{color:#06241a}.btn.sec{background:none;color:var(--pri);border:1px solid var(--pri)}.btn.bad{background:var(--bad);color:#fff}.btn.warn{background:var(--warn);color:#fff}.btn.sm{padding:4px 9px;font-size:12.5px}
    .btn:focus-visible,nav button:focus-visible,td:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
    table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;font-size:13px}th{background:var(--pri2)}
    .scroll{overflow-x:auto}.grid td{width:12%;text-align:center;height:18px;padding:0 2px;overflow:hidden;white-space:nowrap;cursor:pointer;user-select:none}.grid th{padding:2px 6px;font-size:11px}
    .grid td.f{background:var(--pri2)}
    .grid td.p{background:var(--pref2);color:var(--pref);font-weight:700;font-size:10px}
    .grid td.u{background:var(--unpref2);color:var(--unpref);font-weight:700;font-size:10px}
    .grid td.b{background:var(--busy)}
    .chip{display:inline-block;padding:2px 8px;border-radius:12px;background:var(--pri2);color:var(--pri);margin:2px;font-size:12px}.chip.bad{background:var(--bad2);color:var(--bad)}.chip.warn{background:var(--warn2);color:var(--warn)}.chip.pref{background:var(--pref2);color:var(--pref)}.chip.unpref{background:var(--unpref2);color:var(--unpref)}
    .bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
    input,select{font:inherit;font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mut{color:var(--mut);font-size:13px}.note{padding:10px;border-radius:6px;background:var(--warn2);color:var(--warn);margin:8px 0}
    .login{max-width:460px;margin:8vh auto;padding:20px}.login .btn{width:100%;margin:6px 0}
    @media(max-width:750px){.app{flex-direction:column}nav{width:100%;display:flex;flex-wrap:wrap;gap:4px;border-right:0;border-bottom:1px solid var(--line)}nav button{width:auto}nav .logo,nav .who,nav .sec-lbl,nav .org-badge{width:100%}main{padding:14px}}
  </style>
</head>
<body>
<div id="root">Loading ShiftSync...</div>
<script>
const D=['Mon','Tue','Wed','Thu','Fri','Sat'],H0=5,NH=34;
const DEFAULT_ORG_ROLES=['Desk','Registration','Usher','Logistics','Documentation','Stage Manager','Assistant Stage Manager','Stage Crew','Lights','Sounds','AVP'];
const DEFPW='shiftsync123';
const BLK=[[8,10],[10,12],[13,15],[15,17]];

const hl=h=>{const f=Math.floor(h);return(f%12||12)+(h%1?':30':'')+(f<12?'AM':'PM')};
const tsel=(at,v,a=5,b=22)=>{let o='';for(let h=a;h<=b;h+=.5)o+=`<option value="${h}" ${h===v?'selected':''}>${hl(h)}</option>`;return`<select ${at}>${o}</select>`};
const tm=a=>hl(a.s)+'–'+hl(a.e);
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=x=>new Date(x+'T00:00:00');
const addDays=(x,n)=>{const d=pd(x);d.setDate(d.getDate()+n);return ds(d)};
const dow=x=>(pd(x).getDay()+6)%7;
const mondayOf=x=>addDays(x,-dow(x));
const fm=x=>pd(x).toLocaleDateString('en',{month:'short',day:'numeric'});
const validDate=x=>/^\d{4}-\d{2}-\d{2}$/.test(x)&&!Number.isNaN(pd(x).getTime())&&ds(pd(x))===x;
const validTimes=(s,e)=>Number.isFinite(s)&&Number.isFinite(e)&&s>=5&&e<=22&&s<e&&Number.isInteger(s*2)&&Number.isInteger(e*2);
const PAL=['#1f77b4','#e07b00','#2a9d57','#a855c7','#d6336c','#0e9aa7','#8d6e00','#5c6bc0'],cc=id=>PAL[(id-1)%PAL.length];
const esc=t=>(t||'').replace(/"/g,'&quot;');

const fmtHM = decHrs => {
  const totalMins = Math.round((decHrs || 0) * 60);
  const h = Math.floor(totalMins / 60);
  const m = totalMins % 60;
  return `${h}h ${m}m`;
};

let S = {};
let saveQueue = Promise.resolve();

async function syncSave() {
  if (!S || !S.orgs) return;
  const snapshot = JSON.stringify(S);
  const request = saveQueue.then(async () => {
    const response = await fetch('/api/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: snapshot
    });
    if (!response.ok) throw new Error(`Save failed (${response.status})`);
  });
  saveQueue = request.catch(() => {});
  return request;
}

function persistState() {
  syncSave().catch(e => console.error('Sync error:', e));
}

async function loadServerState() {
  try {
    const res = await fetch('/api/state?t=' + Date.now());
    if (!res.ok) throw new Error(`Load failed (${res.status})`);
    S = await res.json();
    ensureDefaults();
    render();
  } catch (e) {
    document.getElementById('root').innerHTML = '<div class="card login"><h2>Unable to connect to ShiftSync</h2><p>Ensure the backend container is running and reload.</p></div>';
  }
}

function ensureDefaults() {
  if (!S.orgs) S.orgs = [
    { id: 'org_1', handle: 'usg', name: 'University Student Government (USG)', deskCap: 2, target: 6, eventWeek: false, eventDays: [], customRoles: [...DEFAULT_ORG_ROLES] },
    { id: 'org_2', handle: 'css', name: 'Computer Science Society (CSS)', deskCap: 2, target: 6, eventWeek: false, eventDays: [], customRoles: ['Desk', 'Registration', 'Usher', 'Logistics', 'Documentation', 'Technical Support'] }
  ];
  S.orgs.forEach((o, i) => {
    if (!o.handle) o.handle = o.prefix || (o.id === 'org_1' ? 'usg' : o.id === 'org_2' ? 'css' : 'org' + (i + 1));
    if (!o.customRoles || !o.customRoles.length) o.customRoles = [...DEFAULT_ORG_ROLES];
  });
  if (!S.members) S.members = [];
  if (!S.history) S.history = [];
  if (!S.timeLogs) S.timeLogs = [];
  if (!S.conflicts) S.conflicts = [];
  if (!S.officerPositions) S.officerPositions = [
    { id: 1, orgId: 'org_1', title: 'President', targetHrs: 12 },
    { id: 2, orgId: 'org_1', title: 'Vice President', targetHrs: 10 },
    { id: 3, orgId: 'org_1', title: 'Committee Head', targetHrs: 8 },
    { id: 4, orgId: 'org_2', title: 'President', targetHrs: 12 },
    { id: 5, orgId: 'org_2', title: 'VP Internal', targetHrs: 10 }
  ];
  if (!S.staff.some(x => x.role === 'superadmin')) {
    S.staff.unshift({ user: 'superadmin', pw: DEFPW, role: 'superadmin', name: 'University Super Admin', orgId: null });
  }
  S.staff.forEach(st => {
    if (st.role === 'admin' && !st.orgId) st.orgId = 'org_1';
  });
  S.members.forEach(m => {
    if (!m.orgId) m.orgId = 'org_1';
    const org = S.orgs.find(o => o.id === m.orgId) || S.orgs[0];
    const cleanMember = m.name.toLowerCase().replace(/[^a-z0-9]/g, '');
    const suffix = m.nick && m.nick.includes('_') ? m.nick.split('_').slice(1).join('_') : cleanMember;
    m.nick = `${org.handle}_${suffix}`;
    if (!m.prefGrid) m.prefGrid = D.map(() => Array(NH).fill(0));
    if (!m.sysRole) m.sysRole = 'member';
  });
  if (!S.superSelectedOrg && S.orgs.length) S.superSelectedOrg = S.orgs[0].id;
}

// === STRICT MULTI-TENANT ORGANIZATION SCOPING ===
function activeOrgId() {
  if (S.role === 'superadmin') return S.superSelectedOrg || (S.orgs[0]?.id || 'org_1');
  if (S.role === 'admin') return S.orgId;
  const me = S.members.find(m => m.id === S.uid);
  return me ? me.orgId : S.orgId;
}

const activeOrg = () => S.orgs.find(o => o.id === activeOrgId()) || S.orgs[0];
const orgName = id => S.orgs.find(o => o.id === id)?.name || 'Unknown Organization';
const orgRoles = () => activeOrg().customRoles || DEFAULT_ORG_ROLES;

// Strictly isolated per-organization data filters (never shared across orgs)
const orgMembers = () => S.members.filter(m => m.orgId === activeOrgId());
const act = () => orgMembers().filter(m => m.status === 'active');
const orgAs = () => S.as.filter(a => a.orgId === activeOrgId());
const orgUn = () => S.un.filter(u => u.orgId === activeOrgId());
const orgEvents = () => S.events.filter(e => e.orgId === activeOrgId());
const orgLogs = () => S.log.filter(l => l.orgId === activeOrgId());
const orgAbs = () => S.abs.filter(a => a.orgId === activeOrgId());
const orgPositions = () => S.officerPositions.filter(p => p.orgId === activeOrgId());
const orgHistory = () => S.history.filter(h => h.orgId === activeOrgId());

function rebuild(m) {
  if (!m.prefGrid) m.prefGrid = D.map(() => Array(NH).fill(0));
  m.grid = D.map(() => Array(NH).fill(0));
  m.classes.forEach(c => {
    for (let h = c.s; h < c.e; h += 0.5) m.grid[c.day][(h - H0) * 2] = c.id;
  });
}

const cur = () => S.members.find(m => m.id === S.uid && m.orgId === activeOrgId()) || orgMembers()[0];
const nm = id => S.members.find(m => m.id === id)?.name || 'Unassigned';

function getTargetHours(m) {
  if (m.posId) {
    const pos = S.officerPositions.find(p => p.id === m.posId);
    if (pos) return pos.targetHrs;
  }
  const org = S.orgs.find(o => o.id === m.orgId) || activeOrg();
  return m.sysRole === 'officer' ? 10 : (org.target || 6);
}

const hrs = (id, t) => orgAs().filter(a => a.mid === id && (!t || a.type === t)).reduce((x, a) => x + (a.e - a.s), 0);

const ver = id => {
  const officerConfirmed = S.log.filter(l => l.mid === id && !l.absent).reduce((t, l) => t + (l.h || 0), 0);
  const clockSessions = S.timeLogs.filter(l => l.mid === id && l.clockOut).reduce((t, l) => t + ((new Date(l.clockOut) - new Date(l.clockIn)) / 3600000), 0);
  return officerConfirmed + clockSessions;
};

const dfc = m => {
  const baseDef = m.def || 0;
  const extraCredited = S.log.filter(l => l.mid === m.id && l.extra).reduce((t, l) => t + (l.h || 0), 0);
  const absentPenalties = S.log.filter(l => l.mid === m.id && l.absent).reduce((t, l) => t + (l.miss || 0), 0);
  return Math.max(0, baseDef - extraCredited + absentPenalties);
};

const isNoClassDate = dateStr => {
  const org = activeOrg();
  return org.eventWeek || (org.eventDays && org.eventDays.includes(dateStr));
};

const hasClassOnDay = (m, dayIdx) => m.classes && m.classes.some(c => c.day === dayIdx);

const free = (m, d, s, e, dateStr) => {
  if (dateStr && isNoClassDate(dateStr)) return true;
  for (let h = s; h < e; h += 0.5) {
    const idx = (h - H0) * 2;
    if (m.grid[d][idx]) return false;
  }
  return true;
};

function slots() {
  const o = [];
  const org = activeOrg();
  const oid = org.id;
  const deskQuota = org.deskCap || 2;
  const rolesList = orgRoles();
  for (let d = 0; d < 5; d++) {
    const dateStr = addDays(S.week, d);
    BLK.forEach(b => {
      for (let q = 0; q < deskQuota; q++) {
        o.push({ orgId: oid, type: 'desk', day: d, date: dateStr, s: b[0], e: b[1], role: 'Desk', slotNum: q + 1 });
      }
    });
  }
  orgEvents().filter(ev => ev.date >= S.week && ev.date <= addDays(S.week, 5) && ev.e > ev.s).forEach(ev => {
    const evRoleKeys = Object.keys(ev.roles || {});
    evRoleKeys.forEach(r => {
      for (let k = 0; k < (ev.roles[r] || 0); k++) {
        o.push({ orgId: oid, type: 'event', day: dow(ev.date), date: ev.date, s: ev.s, e: ev.e, role: r, ev: ev.name, evId: ev.id });
      }
    });
  });
  return o;
}

const ok = (m, s) => {
  if (m.orgId !== s.orgId) return false;
  if (orgAbs().some(x => x.mid === m.id && x.date === s.date)) return false;
  if (S.conflicts.some(c => c.mid === m.id && c.date === s.date && c.s < s.e && s.s < c.e)) return false;
  if (!free(m, s.day, s.s, s.e, s.date)) return false;
  if (s.type === 'desk' && !isNoClassDate(s.date) && !hasClassOnDay(m, s.day)) return false;
  if (orgAs().some(a => a.mid === m.id && a.date === s.date && a.s < s.e && s.s < a.e)) return false;
  return true;
};

const sc = (m, s) => {
  let timePrefScore = 0;
  if (m.prefGrid) {
    for (let h = s.s; h < s.e; h += 0.5) {
      const val = m.prefGrid[s.day][(h - H0) * 2];
      if (val === 1) timePrefScore += 5;
      else if (val === -1) timePrefScore -= 6;
    }
  }
  const roleIdx = (m.prefs || []).indexOf(s.role);
  const roleScore = ((m.prefs || []).length - (roleIdx >= 0 ? roleIdx : 10)) * 2;
  const targetGap = getTargetHours(m) - hrs(m.id);
  return timePrefScore + roleScore + (dfc(m) * 1.5) + (targetGap * 1.2);
};

function solve(list) {
  const t = performance.now(), un = [];
  list.map(s => ({ s, n: act().filter(m => ok(m, s)).length }))
      .sort((a, b) => a.n - b.n)
      .forEach(({ s }) => {
        const c = act().filter(m => ok(m, s)).sort((a, b) => sc(b, s) - sc(a, s));
        if (!c.length) un.push(s);
        else S.as.push({ ...s, id: S.uid2++, mid: c[0].id });
      });
  return { un, ms: performance.now() - t };
}

async function gen() {
  if (S.role !== 'admin') return;
  const oid = activeOrgId();
  if (!act().length) {
    S.msg = `Cannot generate roster: ${activeOrg().name} has 0 active members. Add members first.`;
    return render();
  }
  const btn = document.getElementById('generate-roster');
  if (btn) { btn.disabled = true; btn.textContent = 'Generating...'; }

  S.as = S.as.filter(a => a.orgId !== oid);
  S.un = S.un.filter(u => u.orgId !== oid);

  try {
    await saveQueue;
    const response = await fetch('/api/generate-roster', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...S, targetOrgId: oid })
    });
    if (response.ok) {
      S = await response.json();
    } else {
      throw new Error('Fallback to local constraint solver');
    }
  } catch (e) {
    const r = solve(slots());
    S.un = S.un.concat(r.un);
    S.msg = `Roster generated for ${activeOrg().name} in ${r.ms.toFixed(1)} ms. Unfilled slots: ${r.un.length}.`;
  }
  archiveRoster();
  render();
}

function archiveRoster() {
  const oid = activeOrgId();
  if (!S.history) S.history = [];
  const idx = S.history.findIndex(h => h.week === S.week && h.orgId === oid);
  const snap = {
    orgId: oid,
    week: S.week,
    as: JSON.parse(JSON.stringify(orgAs())),
    un: JSON.parse(JSON.stringify(orgUn())),
    savedAt: new Date().toISOString(),
    eventWeek: activeOrg().eventWeek
  };
  if (idx >= 0) S.history[idx] = snap;
  else S.history.unshift(snap);
}

function reportConflict(aid) {
  const shift = S.as.find(a => a.id === aid);
  if (!shift) return;
  const reason = prompt(`Report conflict for ${D[shift.day]} ${tm(shift)} (${shift.role}). Enter reason:`, 'Schedule conflict');
  if (reason === null) return;

  S.conflicts.push({ orgId: shift.orgId, mid: shift.mid, date: shift.date, s: shift.s, e: shift.e, reason });
  S.as = S.as.filter(a => a.id !== aid);

  const { id, mid, ...slotTemplate } = shift;
  const res = solve([slotTemplate]);
  S.un = S.un.concat(res.un);

  const replacement = orgAs().find(a => a.date === shift.date && a.s === shift.s && a.role === shift.role && a.mid !== mid);
  S.msg = replacement
    ? `Conflict resolved automatically! Reassigned to ${nm(replacement.mid)} without altering anyone else's schedule.`
    : `Conflict logged and shift removed from your schedule. Slot marked unfilled.`;
  archiveRoster();
  render();
}

function clockIn() {
  const m = cur();
  if (!m) return;
  if (S.timeLogs.some(l => l.mid === m.id && !l.clockOut)) {
    S.msg = 'You already have an active duty session running.';
    return render();
  }
  S.timeLogs.push({ id: S.uid2++, orgId: m.orgId, mid: m.id, clockIn: new Date().toISOString(), clockOut: null });
  S.msg = `Clocked in at ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}.`;
  render();
}

function clockOut() {
  const m = cur();
  if (!m) return;
  const active = S.timeLogs.find(l => l.mid === m.id && !l.clockOut);
  if (!active) return;
  active.clockOut = new Date().toISOString();
  const mins = Math.max(1, Math.round((new Date(active.clockOut) - new Date(active.clockIn)) / 60000));
  S.msg = `Clocked out! Rendered ${Math.floor(mins / 60)}h ${mins % 60}m added to your total duty hours.`;
  render();
}

function cycleTimePref(d, i) {
  const m = cur();
  if (!m || m.grid[d][i]) return;
  if (!m.prefGrid) m.prefGrid = D.map(() => Array(NH).fill(0));
  const curVal = m.prefGrid[d][i] || 0;
  m.prefGrid[d][i] = curVal === 0 ? 1 : curVal === 1 ? -1 : 0;
  render();
}

function absent() {
  if (S.role !== 'admin') return;
  const mid = +document.getElementById('am').value, date = document.getElementById('ad').value;
  const gone = orgAs().filter(a => a.mid === mid && a.date === date);
  S.as = S.as.filter(a => !(a.mid === mid && a.date === date));
  S.abs.push({ orgId: activeOrgId(), mid, date });
  const n0 = S.as.length, r = solve(gone.map(({ id, mid, ...x }) => x));
  S.un = S.un.concat(r.un);
  const res = S.as.slice(n0);
  S.msg = `${nm(mid)} marked absent on ${fm(date)}. Re-solved ${gone.length} slot(s) in ${r.ms.toFixed(1)} ms. ` +
    gone.map(a => { const n = res.find(x => x.s === a.s && x.role === a.role); return `${tm(a)} ${a.role}: ${n ? '→ ' + nm(n.mid) : 'unfilled'}`; }).join('; ');
  archiveRoster();
  render();
}

function bench() {
  const sa = [...S.as], su = [...S.un], uid2 = S.uid2, ts = [];
  const oid = activeOrgId();
  try {
    for (let i = 0; i < 20; i++) {
      S.as = S.as.filter(a => a.orgId !== oid);
      ts.push(solve(slots()).ms);
    }
  } finally {
    S.as = sa; S.un = su; S.uid2 = uid2;
  }
  S.bench = (ts.reduce((a, b) => a + b) / 20).toFixed(2);
  render();
}

function addCls() {

function addOrgRole(inputId = 'newrole') {

  }
  org.customRoles.push(rName);

function renOrgRole(idx, newVal) {
  if (S.role !== 'admin') return;
  const org = activeOrg();
  const oldVal = org.customRoles[idx];
  const trimmed = newVal.trim();
  if (!trimmed || trimmed === oldVal) return render();
  org.customRoles[idx] = trimmed;
  orgEvents().forEach(ev => {
    if (ev.roles[oldVal] !== undefined) {
      ev.roles[trimmed] = ev.roles[oldVal];
      delete ev.roles[oldVal];
    }
  });
  orgMembers().forEach(m => {
    if (m.prefs) m.prefs = m.prefs.map(p => p === oldVal ? trimmed : p);
  });
  S.msg = `Renamed "${oldVal}" to "${trimmed}".`; render();
}

function delOrgRole(idx) {
  if (S.role !== 'admin') return;
  const org = activeOrg();
  const removed = org.customRoles[idx];
  org.customRoles.splice(idx, 1);
  orgEvents().forEach(ev => { delete ev.roles[removed]; });
  orgMembers().forEach(m => {
    if (m.prefs) m.prefs = m.prefs.filter(p => p !== removed);
  });
  S.msg = `Removed "${removed}" from organization work roles.`; render();
}

    const d = S.ttDay ?? Math.min(dow(ds(new Date())), 5), M = act();
    const info = (m, i) => {
      const h = H0 + i / 2, a = orgAs().find(x => x.mid === m.id && x.day === d && x.s <= h && h < x.e);
      if (a) return { k: 'a' + a.id, l: a.type === 'event' ? a.role : 'Desk', t: (a.type === 'event' ? a.role + ' (' + a.ev + ') ' : 'Desk ') + tm(a), s: a.type === 'event' ? '#4f46e5' : 'var(--pri)', c: '#fff' };
      const c = m.grid[d][i];
      if (c) return { k: 'c' + c, l: 'Class', t: 'In class', s: 'var(--busy)', c: 'var(--bg)' };
      const pVal = m.prefGrid ? (m.prefGrid[d][i] || 0) : 0;
      if (pVal === 1) return { k: 'p', l: '★', t: 'Preferred free slot', s: 'var(--pref2)', c: 'var(--pref)' };
      if (pVal === -1) return { k: 'u', l: '✕', t: 'Unpreferred slot', s: 'var(--unpref2)', c: 'var(--unpref)' };
      return { k: 'f', l: '', t: 'Free', s: '', c: '' };
    };
    return `<h1>${activeOrg().name} — Member Timetable</h1>
    <div class="row">${D.map((n, i) => `<button class="btn ${i === d ? '' : 'sec'}" onclick="S.ttDay=${i};render()">${n} ${fm(addDays(S.week, i))}</button>`).join('')}</div>
    <p class="mut" style="margin-top:8px"><span class="chip" style="background:var(--pri);color:#fff">Desk duty</span><span class="chip" style="background:#4f46e5;color:#fff">Event duty</span><span class="chip pref">★ Preferred</span><span class="chip unpref">✕ Unpreferred</span><span class="chip" style="background:var(--busy);color:var(--bg)">In class</span></p>
    <div class="card scroll"><table class="grid"><tr><th></th>${M.map(m => `<th>${m.name}</th>`).join('')}<th>On duty</th></tr>
      ${Array.from({ length: NH }, (_, i) => {
        let n = 0;
        const cells = M.map(m => {
          const x = info(m, i), p = i ? info(m, i - 1) : {}, st = x.s ? `background:${x.s};border-color:${x.s};color:${x.c};font-size:10px` : '';
          if (x.k[0] === 'a') n++;
          return `<td class="${x.s ? '' : 'f'}" style="${st}" title="${esc(x.t)}">${x.k !== p.k ? x.l : ''}</td>`;
        }).join('');
        return `<tr><th style="font-weight:${i % 2 ? 400 : 700}">${hl(H0 + i / 2)}</th>${cells}<td><b>${n || ''}</b></td></tr>`;
      }).join('')}
    </table></div>`;
  },

  events() {
    const ev = [...orgEvents()].sort((a, b) => a.date.localeCompare(b.date) || a.s - b.s);
    return `<h1>${activeOrg().name} — Events &amp; Editable Roles</h1><p class="mut">Add, rename, adjust crew counts, or remove roles directly inside each event.</p>
    ${S.msg ? `<div class="note">${S.msg}</div>` : ''}
    ${ev.map(e => {
      const w = dow(e.date);
      const roleEntries = Object.entries(e.roles || {}).filter(([_, cnt]) => cnt > 0);
      return `<div class="card">
        <div class="row">
          <input value="${esc(e.name)}" onchange="upd(${e.id},'name',this.value)">
          <input type="date" value="${e.date}" onchange="upd(${e.id},'date',this.value)">
          <b>${D[w] || 'Sun'}</b>
          ${tsel(`onchange="upd(${e.id},'s',this.value)"`, e.s)}–${tsel(`onchange="upd(${e.id},'e',this.value)"`, e.e)}
          <button class="btn bad sm" onclick="delEv(${e.id})">${S.cd === e.id ? 'Confirm remove' : 'Remove Event'}</button>
        </div>
        <div style="margin-top:12px"><b>Event Roles (Editable)</b>
          <table style="margin-top:6px"><tr><th>Role Title</th><th>Crew Needed</th><th>Action</th></tr>
            ${roleEntries.map(([r, cnt]) => `<tr>
              <td><input value="${esc(r)}" onchange="renEventRole(${e.id}, '${esc(r)}', this.value)"></td>
              <td><input type="number" min="1" max="30" value="${cnt}" style="width:65px" onchange="updR(${e.id}, '${esc(r)}', this.value)"></td>
              <td><button class="btn bad sm" onclick="delEventRole(${e.id}, '${esc(r)}')">Remove Role</button></td>
            </tr>`).join('')}
          </table>
          <div class="row" style="margin-top:8px">
            <input id="ev_newrole_${e.id}" list="org_roles_datalist" placeholder="Add role (e.g. Usher, Marshal, Tech)">
            <button class="btn sm" onclick="addRoleToEvent(${e.id})">+ Add Role to Event</button>
          </div>
        </div>
      </div>`;
    }).join('')}
    <datalist id="org_roles_datalist">${orgRoles().map(r => `<option value="${esc(r)}">`).join('')}</datalist>
    <div class="card"><b>Create New Event</b><div class="row" style="margin-top:8px"><input id="en" placeholder="Event name"><input id="edt" type="date" value="${addDays(S.week, 5)}"><label>Start ${tsel('id="es"', 9)}</label><label>End ${tsel('id="ee"', 15)}</label><button class="btn" onclick="addEv()">Add event</button></div></div>`;
  },

  hours() {
    const ex = orgLogs().filter(l => l.extra).sort((a, b) => a.date.localeCompare(b.date));
    const as = [...orgAs()].sort((a, b) => a.date.localeCompare(b.date) || a.s - b.s);
    const mo = sel => orgMembers().map(m => `<option value="${m.id}" ${m.id === sel ? 'selected' : ''}>${m.name}</option>`).join('');
    return `<h1>${activeOrg().name} — Duty Hours &amp; Absences</h1>
    <h2>Scheduled Duties</h2><div class="card scroll"><table><tr><th>Member</th><th>Date</th><th>Time</th><th>Duty</th><th>Rendered (Hrs &amp; Mins)</th><th>Note</th><th>Actions</th></tr>
      ${as.map(a => {
        const l = orgLogs().find(x => x.aid === a.id);
        const hPart = l ? Math.floor(l.h) : 0;
        const mPart = l ? Math.round((l.h - hPart) * 60) : 0;
        return `<tr><td>${nm(a.mid)}</td><td>${D[a.day]}, ${fm(a.date)}</td><td>${tm(a)}</td><td>${a.type === 'event' ? a.role + ' – ' + a.ev : 'Desk'}</td>
        ${l ? (l.absent ? `<td><span class="chip bad">Absent (-${fmtHM(l.miss)})</span></td>` : `<td><input id="lh_${l.id}" type="number" min="0" max="24" value="${hPart}" style="width:52px" onchange="updLHM(${l.id})">h <input id="lm_${l.id}" type="number" min="0" max="59" value="${mPart}" style="width:52px" onchange="updLHM(${l.id})">m</td>`) +
          `<td><input value="${esc(l.note)}" onchange="updL(${l.id},'note',this.value)"></td><td><button class="btn sec sm" onclick="unconf(${l.id})">Undo</button></td>`
          : `<td>${fmtHM(a.e - a.s)} scheduled</td><td></td><td class="row"><button class="btn sm" onclick="conf(${a.id})">Confirm</button><button class="btn bad sm" onclick="absn(${a.id})">Absent</button></td>`}</tr>`;
      }).join('')}
    </table>${as.length ? '' : '<p class="mut">Generate a roster first.</p>'}</div>
    <h2>Extra Duty Outside Schedule</h2><div class="card"><div class="row"><select id="xm">${mo(0)}</select><input id="xd" type="date" value="${S.week}"><label><input id="xh" type="number" min="0" value="1" style="width:52px">h <input id="xm_min" type="number" min="0" max="59" value="0" style="width:52px">m</label><input id="xn" placeholder="Reason"><button class="btn" onclick="addX()">Add Extra Duty</button></div></div>
    <div class="card scroll">${ex.length ? `<table><tr><th>Member</th><th>Date</th><th>Exact Rendered</th><th>Reason</th><th></th></tr>${ex.map(l => `<tr><td>${nm(l.mid)}</td><td>${fm(l.date)}</td><td><b>${fmtHM(l.h)}</b></td><td>${esc(l.note)}</td><td><button class="btn bad sm" onclick="delL(${l.id})">Remove</button></td></tr>`).join('')}</table>` : '<p class="mut">No extra duty recorded.</p>'}</div>`;
  },

  members() {
    const org = activeOrg();
    const stl = [['active', 'Active'], ['loa', 'LOA'], ['grad', 'Graduated']];
    const sec = (st, t, note) => {
      const L = orgMembers().filter(m => m.status === st);
      return `<h2>${t} (${L.length})</h2><p class="mut">${note}</p><div class="card scroll">${L.length ? `<table><tr><th>Name</th><th>Login Username (${org.handle}_name)</th><th>Access Role</th><th>Officer Position</th><th>Target</th><th>Rendered</th><th>Deficit</th><th>Status</th><th></th></tr>
      ${L.map(m => `<tr><td><input value="${esc(m.name)}" style="width:110px" onchange="updM(${m.id},'name',this.value)"></td><td><code>${org.handle}_</code><input value="${esc((m.nick || '').replace(org.handle + '_', ''))}" style="width:80px" onchange="updNick(${m.id},this.value)"></td>
      <td><select onchange="updM(${m.id},'sysRole',this.value)"><option value="member" ${m.sysRole !== 'officer' ? 'selected' : ''}>Member</option><option value="officer" ${m.sysRole === 'officer' ? 'selected' : ''}>Officer</option></select></td>
      <td><select onchange="updM(${m.id},'posId',this.value)"><option value="">None</option>${orgPositions().map(p => `<option value="${p.id}" ${m.posId === p.id ? 'selected' : ''}>${p.title}</option>`).join('')}</select></td>
      <td><b>${getTargetHours(m)}h</b></td><td>${fmtHM(ver(m.id))}</td><td>${dfc(m) ? `<span class="chip warn">${fmtHM(dfc(m))}</span>` : '0h 0m'}</td>
      <td><select onchange="updM(${m.id},'status',this.value)">${stl.map(x => `<option value="${x[0]}" ${x[0] === st ? 'selected' : ''}>${x[1]}</option>`).join('')}</select>${st === 'grad' ? `<br><span class="chip warn">auto-removal ${fm(addDays(m.gradOn || ds(new Date()), 7))}</span>` : ''}</td>
      <td><button class="btn sec sm" onclick="resetPw(${m.id})">Reset PW</button> <button class="btn bad sm" onclick="delM(${m.id})">${S.cm === m.id ? 'Confirm' : 'Remove'}</button></td></tr>`).join('')}</table>` : '<p class="mut">No members in this category.</p>'}</div>`;
    };
    return `<h1>${org.name} — Members &amp; Permissions</h1>${S.msg ? `<div class="note">${S.msg}</div>` : ''}
    <div class="card"><b>Add Member / Officer to ${org.name}</b><div class="row" style="margin-top:8px"><input id="mn" placeholder="Member first name (e.g. Arden)"><select id="mrole"><option value="member">Regular Member</option><option value="officer">Officer</option></select><select id="mpos"><option value="">No Officer Title</option>${orgPositions().map(p => `<option value="${p.id}">${p.title} (${p.targetHrs}h/wk)</option>`).join('')}</select><button class="btn" onclick="addM()">Add</button></div><p class="mut" style="margin-top:6px">Login username will be created automatically as <code>${org.handle}_name</code> (e.g. <code>${org.handle}_arden</code>).</p></div>
    ${sec('active', 'Active Members', 'Included in automated roster generation strictly for this organization.')}
    ${sec('loa', 'Leave of Absence (LOA)', 'Excluded from schedule generation while on leave.')}
    ${sec('grad', 'Graduated', 'Excluded from scheduling. Accounts scheduled for deletion 7 days post-graduation.')}`;
  },

  absence() {
    return `<h1>${activeOrg().name} — Absence Re-Solver</h1><div class="card"><p class="mut">Marks a member absent on a date and surgically re-assigns only their shifts within ${activeOrg().name}.</p><div class="row"><select id="am">${act().map(m => `<option value="${m.id}">${m.name}</option>`).join('')}</select><select id="ad">${D.map((d, i) => `<option value="${addDays(S.week, i)}">${d} ${fm(addDays(S.week, i))}</option>`).join('')}</select><button class="btn" onclick="absent()">Mark Absent &amp; Re-Solve</button></div></div>${S.msg ? `<div class="note">${S.msg}</div>` : ''}${orgAbs().length ? `<div class="card"><b>Recorded Absences</b><br>${orgAbs().map(a => `<span class="chip warn">${nm(a.mid)} · ${fm(a.date)}</span>`).join('')}</div>` : ''}`;
  }
};

const NAV = {
  member: [
    ['home', 'Dashboard'],
    ['avail', 'Availability & Grid'],
    ['prefs', 'Duty Preferences'],
    ['sched', 'My Schedule'],
    ['susp', 'Feedback (SUS)'],
    ['prof', 'Profile'],
    ['priv', 'Privacy']
  ],
  officer: [
    { sec: 'Organization Oversight' },
    ['ohome', 'Org Dashboard'],
    ['oroster', 'View Roster'],
    ['tt', 'Member Timetable'],
    ['oevents', 'View Events'],
    ['ohours', 'View Duty Hours'],
    ['omembers', 'Members List'],
    { sec: 'My Duty Portal' },
    ['home', 'My Duty Dashboard'],
    ['avail', 'My Availability Grid'],
    ['prefs', 'My Duty Preferences'],
    ['sched', 'My Schedule'],
    ['prof', 'Profile']
  ],
  admin: [
    ['ahome', 'Dashboard & Preferences'],
    ['roster', 'Roster Generator'],
    ['history', 'Saved Rosters'],
    ['tt', 'Timetable'],
    ['events', 'Events & Roles'],
    ['hours', 'Duty Hours'],
    ['members', 'Members & Roles'],
    ['officers', 'Officer Positions'],
    ['absence', 'Absence Re-Solver'],
    ['prof', 'Profile'],
    ['priv', 'Privacy']
  ],
  superadmin: [
    ['superhome', 'University Monitor'],
    ['super_roster', 'View Org Schedule'],
    ['super_events', 'View Org Events'],
    ['prof', 'Profile']
  ]
};

function render() {
  const r = document.getElementById('root');
  if (!S || !S.orgs) return;

  if (!S.role) {
    r.innerHTML = `<div class="card login"><h1>ShiftSync</h1><p class="mut">Sign in with your username and password.</p>${S.err ? `<div class="note" style="background:var(--bad2);color:var(--bad)">${S.err}</div>` : ''}
    <label>Username<br><input id="lu" value="${esc(S.lu || '')}" style="width:100%" autocomplete="username"></label><br><br>
    <label>Password<br><input id="lp" type="password" style="width:100%" onkeydown="if(event.key=='Enter')signin()" autocomplete="current-password"></label><br><br>
    <button class="btn" onclick="signin()">Sign in</button>
    <div class="note"><b>Demo Accounts (Password: <code>${DEFPW}</code>)</b><br>
    Super Admin (Monitor &amp; Org Creation): <code>superadmin</code><br>
    USG Admin: <code>usg_admin</code> · CSS Admin: <code>css_admin</code><br>
    USG Officer: <code>usg_arden</code> · CSS Officer: <code>css_gio</code><br>
    USG Member: <code>usg_bea</code> · CSS Member: <code>css_hana</code></div></div>`;
    persistState();
    return;
  }

  const navItems = NAV[S.role] || NAV.member;
  const badgeText = S.role === 'superadmin' ? 'University Super Admin' : `${activeOrg().name} (${activeOrg().handle}_*)`;
  r.innerHTML = `<div class="app"><nav><div class="logo">ShiftSync</div>
    <div class="org-badge">${badgeText}</div>
    ${navItems.map(n => n.sec ? `<div class="sec-lbl">${n.sec}</div>` : `<button class="${S.page === n[0] ? 'on' : ''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}
    <div class="who">${acct().name} · ${S.role.toUpperCase()}<br><a href="#" onclick="S.role=null;S.err='';S.lu='';render();return false" style="color:var(--pri)">Sign out</a></div>
  </nav><main>${(P[S.page] || P.home)()}</main></div>`;
  persistState();
}

loadServerState();
</script>
</body>
</html>
